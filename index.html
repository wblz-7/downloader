<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wblzy - Direct Video Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --brand-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --btn-gradient: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --bg-dark: #070a14;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --tg-color: #24a1de;
            --cyan: #06b6d4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; position: relative; }

        .ambient-glows { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .ambient-blob { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.45; }
        .blob-1 { width: 500px; height: 500px; background: rgba(99, 102, 241, 0.35); top: -120px; left: -120px; }
        .blob-2 { width: 480px; height: 480px; background: rgba(236, 72, 153, 0.3); bottom: -80px; right: -80px; }

        nav { position: relative; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(7, 10, 20, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--card-border); }
        .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-gradient); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: #fff; }
        .brand-name { font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 800; background: linear-gradient(90deg, #ffffff 40%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .header-tg-btn { display: inline-flex; align-items: center; gap: 9px; background: rgba(36, 161, 222, 0.12); border: 1px solid rgba(36, 161, 222, 0.35); color: #fff; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: 0.3s; }
        .header-tg-btn:hover { background: var(--tg-color); }

        .main-container { position: relative; z-index: 10; max-width: 860px; margin: auto; padding: 50px 20px; text-align: center; width: 100%; }
        .hero-title { font-family: 'Outfit', sans-serif; font-size: 3rem; font-weight: 800; margin-bottom: 14px; }
        .hero-title span { background: var(--brand-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-subtitle { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 35px; }

        .search-wrapper { background: var(--glass-bg); border: 1px solid var(--card-border); backdrop-filter: blur(25px); padding: 32px; border-radius: 26px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5); }
        .input-bar { display: flex; gap: 12px; }
        .input-bar input { flex: 1; padding: 18px 22px; border-radius: 16px; background: rgba(10, 14, 27, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; font-size: 1.05rem; outline: none; }
        
        .submit-btn { background: var(--btn-gradient); border: none; color: #fff; padding: 0 36px; border-radius: 16px; font-size: 1.1rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; white-space: nowrap; }
        .submit-btn:hover { transform: translateY(-2px); }

        footer { position: relative; z-index: 10; margin-top: auto; padding: 40px 20px; text-align: center; background: rgba(7, 10, 20, 0.85); border-top: 1px solid var(--card-border); backdrop-filter: blur(20px); }
        .tg-pulse-btn { display: inline-flex; align-items: center; gap: 12px; background: var(--tg-color); color: #fff; padding: 15px 36px; border-radius: 50px; text-decoration: none; font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; }
        .copyright { color: var(--text-muted); font-size: 0.85rem; }

        @media (max-width: 680px) {
            .hero-title { font-size: 2.1rem; }
            .input-bar { flex-direction: column; }
            .submit-btn { padding: 18px; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="ambient-glows">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
    </div>

    <nav>
        <a href="#" class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-cloud-arrow-down"></i></div>
            <span class="brand-name">wblzy</span>
        </a>
        <a href="https://t.me/wblzy" target="_blank" class="header-tg-btn">
            <i class="fa-brands fa-telegram fa-lg"></i>
            <span>t.me/wblzy</span>
        </a>
    </nav>

    <div class="main-container">
        <h1 class="hero-title">Fast & Smooth <span>Video Downloader</span></h1>
        <p class="hero-subtitle">Paste your video link below and download directly to your device.</p>

        <div class="search-wrapper">
            <div class="input-bar">
                <input type="text" id="videoLinkInput" placeholder="Paste video link here..." autocomplete="off">
                <button class="submit-btn" id="downloadBtn" onclick="startDownload()">
                    <i class="fa-solid fa-arrow-down"></i>
                    <span>Download</span>
                </button>
            </div>
        </div>
    </div>

    <footer>
        <div>
            <a href="https://t.me/wblzy" target="_blank" class="tg-pulse-btn">
                <i class="fa-brands fa-telegram fa-xl"></i>
                <span>Telegram Support: @wblzy</span>
            </a>
        </div>
        <p class="copyright">© 2026 <strong>wblzy</strong>. All Rights Reserved.</p>
    </footer>

    <script>
        function startDownload() {
            const input = document.getElementById('videoLinkInput');
            const url = input.value.trim();

            if (!url) {
                alert("Please paste a video link first!");
                input.focus();
                return;
            }

            const btn = document.getElementById('downloadBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';

            // Render पर होस्ट होने के बाद मिलने वाला URL यहाँ डालें (उदा. https://your-app.onrender.com)
            const backendServerURL = "http://localhost:3000/download?url=" + encodeURIComponent(url);

            window.location.href = backendServerURL;

            setTimeout(() => {
                btn.innerHTML = '<i class="fa-solid fa-arrow-down"></i> <span>Download</span>';
            }, 4000);
        }
    </script>
</body>
</html>
